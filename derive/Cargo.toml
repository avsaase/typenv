[package]
name = "from-env-derive"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
darling = "0.21"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["derive", "parsing"] }

[dev-dependencies]
# For the doc examples. Cargo allows this cycle for dev-dependencies.
from-env = { path = ".." }
temp-env = "0.3.6"
