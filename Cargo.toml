[package]
name = "typenv"
version.workspace = true
edition.workspace = true
description = "Load environment variables into a type-safe struct with a derive macro"
documentation = "https://docs.rs/typenv"
repository.workspace = true
license.workspace = true
keywords = ["config", "configuration", "derive", "env", "environment"]
categories = ["config"]

[package.metadata.docs.rs]
all-features = true

[workspace]
resolver = "3"
members = ["derive"]

[workspace.package]
version = "0.0.3"
edition = "2024"
repository = "https://github.com/avsaase/typenv"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
typenv-derive = { path = "derive", version = "=0.0.3" }

[dev-dependencies]
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
temp-env = "0.3.6"
trybuild = "1.0.122"

[features]
default = []
json = ["dep:serde_json", "serde"]
serde = ["dep:serde"]
