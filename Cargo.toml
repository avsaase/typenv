[package]
name = "typenv"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["derive"]

[dependencies]
typenv-derive = { path = "derive", version = "=0.1.0" }
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
temp-env = "0.3.6"
trybuild = "1.0.122"

[features]
default = []
json = ["dep:serde", "dep:serde_json"]
